name: delete-branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main and the two open dotnet 11 dependabot branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/branches" --jq '.[].name' > branches.txt
          while read -r b; do
            case "$b" in
              main|dependabot/docker/dotnet/sdk-11.0|dependabot/docker/dotnet/runtime-11.0) continue ;;
            esac
            echo "deleting $b"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" || echo "failed $b"
          done < branches.txt
