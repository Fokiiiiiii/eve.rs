name: Delete leftover branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in dependabot/docker/dotnet/runtime-11.0 fix-catalog-test land-combat-audit salvage-pos-module; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" || echo "could not delete $b"
          done
