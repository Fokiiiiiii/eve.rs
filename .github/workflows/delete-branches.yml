name: delete-branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/branches" --jq '.[].name' > branches.txt
          while read -r b; do
            if [ "$b" != "main" ]; then
              echo "deleting $b"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$b" || echo "failed $b"
            fi
          done < branches.txt
