name: Vendor pinned SDE

on:
  push:
    paths:
      - ".github/workflows/vendor-pinned-sde.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned SDE archive
        shell: bash
        run: |
          set -euo pipefail
          build=3396210
          name="eve-online-static-data-${build}-jsonl"
          url="https://data.everef.net/ccp/sde/2026/${name}.zip"

          mkdir -p sde/data
          rm -rf "sde/data/${name}"
          rm -f .gitattributes
          curl -fL --retry 5 --retry-delay 2             -o "sde/data/${name}.zip"             "$url"

          python3 - "sde/data/${name}.zip" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"corrupt zip member: {bad}")
              names = [x.filename.rsplit("/", 1)[-1] for x in z.infolist() if not x.is_dir()]
              if "_sde.jsonl" not in names:
                  raise SystemExit("not an SDE archive: missing _sde.jsonl")
              print(f"verified {path}: {len(names)} files")
          PY

          sha256sum "sde/data/${name}.zip"

      - name: Commit archive only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .gitattributes sde/data
          if git diff --cached --quiet; then
            echo "Pinned SDE archive is already present."
            exit 0
          fi
          git commit -m "Store EVE SDE build 3396210 as archive only"
          git push origin HEAD:main
