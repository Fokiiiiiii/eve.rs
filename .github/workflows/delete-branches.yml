name: Delete landing branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the finished landing branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in cx3 cx4-ship-rpcs cx5-red-main-fix-20261116 land-pos-assembly; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" || true
          done
