name: CI

# Run on pushes to main (except documentation-only changes) and by hand: format, lint and test the Rust workspace, test the .NET solution against a
# PostgreSQL 18 service with the static data loaded, run the Python client's own tests, check that the golden
# fixtures are what their generators write, and run the fast end-to-end tests (the whole server stack and the
# headless client). The slow end-to-end tests are live-slow.yml (also by hand).

# Manual runs accept a comma-separated job selection; the default runs every required gate. The same checks can be run locally
# with tools/dev/check-all.sh.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated jobs: rust-fmt,rust-test,dotnet,python,fixtures,live (or all)'
        required: true
        default: all
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the toolchain the project is built and tested with (Cargo.toml's rust-version is 1.94); a newer clippy's new lints are
  # looked at by the advisory job below, not allowed to break the build
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  # the host seeds the NPC market from CCP's ESI on its first start (minutes, and a load on ESI): not in CI
  EVE_MARKET_SEED: skip

jobs:
  rust-fmt:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-test') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - id: sde
        uses: actions/cache@v6
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Fetch the static data
        if: steps.sde.outputs.cache-hit != 'true'
        run: cargo run -q -p eve-sde -- ensure
      - run: cargo test --workspace

  rust-latest:
    name: Rust on the latest stable (advisory)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: latest
      - run: cargo clippy --workspace --all-targets -- -D warnings

  dotnet-build:
    name: .NET build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet') }}
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        working-directory: dotnet
        run: |
          dotnet build EveRs.slnx -c Release -nologo --verbosity minimal -nodeReuse:false
          dotnet build-server shutdown
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-build
          path: |
            dotnet/**/bin/Release/**
            dotnet/**/obj/project.assets.json
          if-no-files-found: error

  dotnet:
    name: .NET (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: dotnet-build
    if: ${{ always() && needs.dotnet-build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet')) }}
    strategy:
      fail-fast: false
      matrix:
        # one service container per shard, so the shards do not share a database; the two largest projects get a shard each
        shard:
          - { name: "space tests", only: "Eve.Services.Space.Tests" }
          - { name: "host tests", only: "Eve.Host.Tests" }
          - { name: "all other tests", only: "" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      # the static data is loaded into PostgreSQL by the Rust tool, as the server does on its first start
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Load the static data into PostgreSQL
        run: |
          cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
          cargo run -q -p eve-sde -- ensure --missions --pg "$EVE_PG_URL"
      - uses: actions/download-artifact@v7
        with:
          name: dotnet-build
          path: dotnet
      - name: Test
        working-directory: dotnet
        env:
          EVE_PG_URL: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=eve
          ONLY: ${{ matrix.shard.only }}
        run: |
          status=0
          for proj in tests/*/*.csproj; do
            name="$(basename "$proj" .csproj)"
            if [ -n "$ONLY" ]; then
              [ "$name" = "$ONLY" ] || continue
            else
              [ "$name" != "Eve.Services.Space.Tests" ] && [ "$name" != "Eve.Host.Tests" ] || continue
            fi
            dotnet test "$proj" -c Release --no-build -nologo --verbosity minimal -nodeReuse:false || status=1
          done
          exit $status
      - name: Shut down build servers
        if: always()
        run: dotnet build-server shutdown

  python:
    name: Python client (golden and mock-server tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'python') }}
    defaults:
      run:
        working-directory: tools/headless-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/headless-client/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # the live tests skip without a server; what is left runs on its own (the marshal golden frames, the mock server)
      - run: python -m pytest -q -rs

  fixtures:
    name: Fixtures match their generators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'fixtures') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate the link fixtures
        run: |
          python3 tools/dev/gen-simlink-fixtures.py
          python3 tools/dev/gen-hostlink-fixtures.py
      - name: Fail if a generator and its committed fixture disagree
        run: git diff --exit-code -- oracle/

  live:
    name: End to end (server stack + headless client)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'live') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Load the static data into PostgreSQL
        run: cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
      - name: Install the headless client
        run: |
          python3 -m venv tools/headless-client/.venv
          tools/headless-client/.venv/bin/pip install -q -r tools/headless-client/requirements-dev.txt
      - name: A PostgreSQL client for the harness (it drops its scratch schemas)
        run: command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run the server stack and the fast live tests
        env:
          EVE_LIVE_LOG_DIR: ${{ github.workspace }}/.live-logs
          KEEP_LOGS: "1"
        run: tools/dev/run-eve-live.sh
      - name: Keep the logs of the stack
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-logs
          path: .live-logs
          if-no-files-found: ignore

  gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [rust-fmt, rust-test, dotnet-build, dotnet, python, fixtures, live]
    steps:
      - name: Require all selected jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
