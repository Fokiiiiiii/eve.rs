[package]
name = "eve-net"
description = "The network front of eve.rs: the client's TCP connection, the login handshake, and the link to the service host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
eve-marshal = { path = "../eve-marshal" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }

[dev-dependencies]
serde_json = "1"
