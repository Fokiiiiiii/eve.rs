name: CI

# Trigger mode is set by tools/dev/ci-mode.py (automatic by default; manual-only for private-repository operation).
# Run on pushes to main (except documentation-only changes) and by hand: format, lint and test the Rust workspace, test the .NET solution against a
# PostgreSQL 18 service with the static data loaded, run the Python client's own tests, check that the golden
# fixtures are what their generators write, and run the fast end-to-end tests (the whole server stack and the
# headless client). The slow end-to-end tests are live-slow.yml (also by hand).

# Each push gets its own concurrency group so every commit receives a complete CI result. Manual runs can cancel older manual runs. Manual runs accept a comma-separated job selection.
# The default runs every required gate. The same checks can be run locally
# with tools/dev/check-all.sh.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated jobs: rust-fmt,rust-test,dotnet,python,fixtures,live,windows (or all)'
        required: true
        default: all
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.ref) || format('ci-{0}-interactive', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the toolchain the project is built and tested with (Cargo.toml's rust-version is 1.94); a newer clippy's new lints are
  # looked at by the advisory job below, not allowed to break the build
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  # the host seeds the NPC market from CCP's ESI on its first start (minutes, and a load on ESI): not in CI
  EVE_MARKET_SEED: skip

jobs:
  rust-fmt:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-test')) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - id: sde
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Fetch the static data
        if: steps.sde.outputs.cache-hit != 'true'
        run: cargo run -q -p eve-sde -- ensure
      - run: cargo test --workspace

  rust-latest:
    name: Rust on the latest stable (advisory)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable toolchain channel
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: latest
      - run: cargo clippy --workspace --all-targets -- -D warnings

  dotnet-build:
    name: .NET build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet')) }}
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        working-directory: dotnet
        run: |
          dotnet build EveRs.slnx -c Release -nologo --verbosity minimal -nodeReuse:false
          dotnet build-server shutdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-build
          path: |
            dotnet/**/bin/Release/**
            dotnet/**/obj/project.assets.json
          if-no-files-found: error

  dotnet:
    name: .NET (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: dotnet-build
    if: ${{ always() && github.event_name != 'schedule' && needs.dotnet-build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet')) }}
    strategy:
      fail-fast: false
      matrix:
        # one service container per shard, so the shards do not share a database; the two largest projects get a shard each
        shard:
          - { name: "space tests", only: "Eve.Services.Space.Tests" }
          - { name: "host tests", only: "Eve.Host.Tests" }
          - { name: "all other tests", only: "" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      # the static data is loaded into PostgreSQL by the Rust tool, as the server does on its first start
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Load the static data into PostgreSQL
        run: |
          cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
          cargo run -q -p eve-sde -- ensure --missions --pg "$EVE_PG_URL"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dotnet-build
          path: dotnet
      - name: Test
        working-directory: dotnet
        env:
          EVE_PG_URL: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=eve
          ONLY: ${{ matrix.shard.only }}
        run: |
          status=0
          for proj in tests/*/*.csproj; do
            name="$(basename "$proj" .csproj)"
            if [ -n "$ONLY" ]; then
              [ "$name" = "$ONLY" ] || continue
            else
              [ "$name" != "Eve.Services.Space.Tests" ] && [ "$name" != "Eve.Host.Tests" ] || continue
            fi
            dotnet test "$proj" -c Release --no-build -nologo --verbosity minimal -nodeReuse:false || status=1
          done
          exit $status
      - name: Shut down build servers
        if: always()
        run: dotnet build-server shutdown

  python:
    name: Python client (golden and mock-server tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'python')) }}
    defaults:
      run:
        working-directory: tools/headless-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/headless-client/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # the live tests skip without a server; what is left runs on its own (the marshal golden frames, the mock server)
      - run: python -m pytest -q -rs

  fixtures:
    name: Fixtures match their generators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'fixtures')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate the link fixtures
        run: |
          python3 tools/dev/gen-simlink-fixtures.py
          python3 tools/dev/gen-hostlink-fixtures.py
      - name: Fail if a generator and its committed fixture disagree
        run: git diff --exit-code -- oracle/

  live:
    name: End to end (server stack + headless client)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'live')) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Load the static data into PostgreSQL
        run: cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
      - name: Install the headless client
        run: |
          python3 -m venv tools/headless-client/.venv
          tools/headless-client/.venv/bin/pip install -q -r tools/headless-client/requirements-dev.txt
      - name: A PostgreSQL client for the harness (it drops its scratch schemas)
        run: command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run the server stack and the fast live tests
        env:
          EVE_LIVE_LOG_DIR: ${{ github.workspace }}/.live-logs
          KEEP_LOGS: "1"
        run: tools/dev/run-eve-live.sh
      - name: Keep the logs of the stack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-logs
          path: .live-logs
          if-no-files-found: ignore

  windows-paths:
    name: Select Windows coverage
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          $selected = $false
          if ($env:EVENT_NAME -eq 'schedule' -or ($env:EVENT_NAME -eq 'workflow_dispatch' -and ($env:JOBS -eq 'all' -or $env:JOBS -match '(^|,)windows(,|$)'))) {
            $selected = $true
          } elseif ($env:EVENT_NAME -eq 'push') {
            $paths = git diff --name-only $env:BEFORE $env:HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not determine changed paths for the Windows runner.' }
            foreach ($path in $paths) {
              if ($path -match '^(crates/|dotnet/|tools/windows/|tools/dev/|tools/headless-client/|sde/|\.cargo/|Cargo\.(toml|lock)$|rustfmt\.toml$|global\.json$|\.gitattributes$|\.github/workflows/ci\.yml$)') {
                $selected = $true
                break
              }
            }
          }
          "selected=$($selected.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  windows:
    name: Windows Rust, .NET, Python and live client
    runs-on: windows-latest
    needs: windows-paths
    if: ${{ needs.windows-paths.outputs.selected == 'true' }}
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
      EVE_MARKET_SEED: skip
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL 18
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'postgresql-18.4-1-windows-x64.exe'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-18.4-1-windows-x64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('--mode', 'unattended', '--unattendedmodeui', 'none', '--superpassword', 'postgres', '--serverport', '5432', '--enable-components', 'server,commandlinetools', '--disable-components', 'pgAdmin,stackbuilder')
          if ($process.ExitCode -ne 0) { throw "PostgreSQL installer exited with $($process.ExitCode)." }
          $env:Path = "C:\Program Files\PostgreSQL\18\bin;$env:Path"
          "C:\Program Files\PostgreSQL\18\bin" >> $env:GITHUB_PATH
          $env:PGPASSWORD = 'postgres'
          $deadline = (Get-Date).AddMinutes(2)
          do { pg_isready -h 127.0.0.1 -p 5432 -U postgres; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL 18 did not become ready.' }
          createdb -h 127.0.0.1 -U postgres eve
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the eve test database.' }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.cargo\registry\cache
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
      - name: Rust format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Load SDE and test Rust workspace
        run: |
          cargo run -q -p eve-sde -- ensure --pg $env:EVE_PG_URL
          if ($LASTEXITCODE -ne 0) { throw 'SDE loading failed.' }
          cargo run -q -p eve-sde -- ensure --missions --pg $env:EVE_PG_URL
          if ($LASTEXITCODE -ne 0) { throw 'Mission data loading failed.' }
          cargo test --workspace
      - name: Build .NET solution
        working-directory: dotnet
        run: |
          dotnet build EveRs.slnx -c Release -nologo --verbosity minimal -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw '.NET build failed.' }
      - name: Shut down .NET build servers after build
        if: always()
        run: dotnet build-server shutdown
      - name: Run PostgreSQL-backed .NET test projects
        working-directory: dotnet
        run: |
          $env:EVE_PG_URL = 'Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=eve'
          dotnet test EveRs.slnx -c Release --no-build -nologo --verbosity minimal -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw '.NET tests failed.' }
      - name: Shut down .NET build servers after tests
        if: always()
        run: dotnet build-server shutdown
      - name: Run Python client tests
        working-directory: tools/headless-client
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          python -m pytest -q -rs
      - name: Exercise the PowerShell 5.1 headless entry point
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows/run-headless.ps1 -PytestArgs tests/test_marshal_golden.py tests/test_handshake_mock.py
      - name: Start server and walk the Windows client path
        shell: pwsh
        run: |
          $start = Join-Path $PWD 'tools/windows/start-server.bat'
          $server = Start-Process -FilePath 'cmd.exe' -ArgumentList ('/c "' + $start + '"') -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(10)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($server.HasExited) { throw "Server exited with $($server.ExitCode)." }
              $client = New-Object System.Net.Sockets.TcpClient
              try { $client.Connect('127.0.0.1', 26000); $ready = $true } catch { Start-Sleep -Milliseconds 500 } finally { $client.Close() }
              if ($ready) { break }
            }
            if (-not $ready) { throw 'The Windows stack did not open port 26000.' }
            & (Join-Path $PWD 'tools/windows/run-headless.ps1') -Live -PytestArgs @('tests/test_live.py', 'tests/test_login_to_character.py')
            if ($LASTEXITCODE -ne 0) { throw 'The end-to-end Windows client walk failed.' }
          } finally {
            $stop = Join-Path $PWD 'tools/windows/stop-server.bat'
            $stopProcess = Start-Process -FilePath 'cmd.exe' -ArgumentList ('/c "' + $stop + '"') -Wait -PassThru
            if ($stopProcess.ExitCode -ne 0) { throw "The Windows stop wrapper exited with $($stopProcess.ExitCode)." }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

  gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    # Windows coverage remains diagnostic until its runner job is green; Linux gate results do not wait on it.
    needs: [rust-fmt, rust-test, dotnet-build, dotnet, python, fixtures, live]
    steps:
      - name: Require all selected jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Required CI gate for $GITHUB_SHA ($GITHUB_REF)"
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
