name: CI

# Trigger mode is set by tools/dev/ci-mode.py (automatic by default; manual-only for private-repository operation).
# Run on pushes to main (except documentation-only changes) and by hand: format, lint and test the Rust workspace,
# build and test the .NET solution, run the Python client's tests, verify generated fixtures, exercise the Linux
# server stack and headless client, and call the Windows build and live-client workflow. The slow end-to-end tests
# are live-slow.yml (also by hand).

# Main pushes use one concurrency group per SHA and cannot cancel one another. Superseded branch and pull request runs can be cancelled. Manual runs accept a comma-separated job selection.
# The default runs every required gate. The Windows workflow runs on a native runner. The same local checks can be run
# with tools/dev/check-all.sh.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated jobs: rust-fmt,rust-test,dotnet,python,fixtures,live,windows (or all)'
        required: true
        default: all
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}-interactive', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

env:
  # the toolchain the project is built and tested with (Cargo.toml's rust-version is 1.94); a newer clippy's new lints are
  # looked at by the advisory job below, not allowed to break the build
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  # the host seeds the NPC market from CCP's ESI on its first start (minutes, and a load on ESI): not in CI
  EVE_MARKET_SEED: skip

jobs:
  rust-fmt:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-test')) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - id: sde
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}-${{ hashFiles('sde/lock.json') }}
      - name: Fetch the static data
        if: steps.sde.outputs.cache-hit != 'true'
        run: cargo run -q -p eve-sde -- ensure
      - run: cargo test --workspace

  rust-latest:
    name: Rust on the latest stable (advisory)
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'rust-fmt')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable toolchain channel
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: latest
      - run: cargo clippy --workspace --all-targets -- -D warnings

  dotnet-build:
    name: .NET build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet')) }}
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        working-directory: dotnet
        run: |
          dotnet build EveRs.slnx -c Release -nologo --verbosity minimal -nodeReuse:false
          dotnet build-server shutdown
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-build
          path: |
            dotnet/**/bin/Release/**
            dotnet/**/obj/project.assets.json
          if-no-files-found: error

  dotnet:
    name: .NET (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: dotnet-build
    if: ${{ always() && github.event_name != 'schedule' && needs.dotnet-build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'dotnet')) }}
    strategy:
      fail-fast: false
      matrix:
        # Every shard has its own PostgreSQL service. Host and Space cases and other projects are assigned as separate shards.
        shard:
          - { name: "space tests 1/2", artifact: "space-1", only: "Eve.Services.Space.Tests", index: 0, count: 2 }
          - { name: "space tests 2/2", artifact: "space-2", only: "Eve.Services.Space.Tests", index: 1, count: 2 }
          - { name: "host tests 1/4", artifact: "host-1", only: "Eve.Host.Tests", index: 0, count: 4 }
          - { name: "host tests 2/4", artifact: "host-2", only: "Eve.Host.Tests", index: 1, count: 4 }
          - { name: "host tests 3/4", artifact: "host-3", only: "Eve.Host.Tests", index: 2, count: 4 }
          - { name: "host tests 4/4", artifact: "host-4", only: "Eve.Host.Tests", index: 3, count: 4 }
          - { name: "other tests 1/3", artifact: "other-1", only: "", index: 0, count: 3 }
          - { name: "other tests 2/3", artifact: "other-2", only: "", index: 1, count: 3 }
          - { name: "other tests 3/3", artifact: "other-3", only: "", index: 2, count: 3 }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
      DOTNET_CLI_USE_MSBUILD_SERVER: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props', 'dotnet/**/*.csproj', 'dotnet/**/*.props', 'dotnet/**/*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      # the static data is loaded into PostgreSQL by the Rust tool, as the server does on its first start
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}-${{ hashFiles('sde/lock.json') }}
      - name: Load the static data into PostgreSQL
        run: |
          cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
          cargo run -q -p eve-sde -- ensure --missions --pg "$EVE_PG_URL"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-build
          path: dotnet
      - name: Test
        working-directory: dotnet
        env:
          EVE_PG_URL: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=eve
          ONLY: ${{ matrix.shard.only }}
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_COUNT: ${{ matrix.shard.count }}
        run: |
          status=0
          if [ "$ONLY" = "Eve.Host.Tests" ] || [ "$ONLY" = "Eve.Services.Space.Tests" ]; then
            proj="tests/$ONLY/$ONLY.csproj"
            dotnet test "$proj" -c Release --no-build -nologo --verbosity minimal -nodeReuse:false --list-tests > /tmp/test-list.txt
            filter="$(python3 ../tools/dev/shard-dotnet-tests.py /tmp/test-list.txt "$SHARD_INDEX" "$SHARD_COUNT")"
            dotnet test "$proj" -c Release --no-build -nologo --verbosity minimal -nodeReuse:false --filter "$filter" --results-directory test-results --logger "trx;LogFileName=$ONLY-$SHARD_INDEX.trx" || status=1
          else
            projects="$(python3 ../tools/dev/shard-dotnet-projects.py "$SHARD_INDEX" "$SHARD_COUNT" tests/*/*.csproj)"
            for name in $projects; do
              [ "$name" = "Eve.Services.Space.Tests" ] && continue
              [ "$name" = "Eve.Host.Tests" ] && continue
              proj="tests/$name/$name.csproj"
              dotnet test "$proj" -c Release --no-build -nologo --verbosity minimal -nodeReuse:false --results-directory test-results --logger "trx;LogFileName=$name.trx" || status=1
            done
          fi
          exit $status
      - name: Verify every test shard executed tests
        working-directory: dotnet
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree

          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          reports = sorted(Path("test-results").glob("*.trx"))
          if not reports:
              raise SystemExit("No TRX test reports were produced")
          empty = []
          for report in reports:
              root = ElementTree.parse(report).getroot()
              counters = root.find("trx:ResultSummary/trx:Counters", namespace)
              executed = int(counters.attrib["executed"]) if counters is not None else 0
              if executed == 0:
                  empty.append(str(report))
          if empty:
              raise SystemExit("No tests executed in: " + ", ".join(empty))
          PYTEST
      - name: Upload test timing results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results-${{ matrix.shard.artifact }}
          path: dotnet/test-results/*.trx
          if-no-files-found: ignore
      - name: Shut down build servers
        if: always()
        run: dotnet build-server shutdown

  python:
    name: Python client (golden and mock-server tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'python')) }}
    defaults:
      run:
        working-directory: tools/headless-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/headless-client/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test CI status output parsing
        run: python3 ../dev/test_ci_status.py
      - name: Test service audit extraction
        working-directory: .
        run: python3 -m unittest discover -s tools/spec-extract -p 'test_service_audit*.py'
      # the live tests skip without a server; what is left runs on its own (the marshal golden frames, the mock server)
      - run: python -m pytest -q -rs

  fixtures:
    name: Fixtures match their generators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'fixtures')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate the link fixtures
        run: |
          python3 tools/dev/gen-simlink-fixtures.py
          python3 tools/dev/gen-hostlink-fixtures.py
      - name: Fail if a generator and its committed fixture disagree
        run: git diff --exit-code -- oracle/

  live:
    name: End to end (server stack + headless client)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'live')) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
          # the Host tests open many pools at once; the default of 100 connections runs out (53300)
          POSTGRES_INITDB_ARGS: "-c max_connections=400 -c shared_buffers=512MB -c fsync=off -c full_page_writes=off -c synchronous_commit=off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}-${{ hashFiles('sde/lock.json') }}
      - name: Load the static data into PostgreSQL
        run: cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
      - name: Install the headless client
        run: |
          python3 -m venv tools/headless-client/.venv
          tools/headless-client/.venv/bin/pip install -q -r tools/headless-client/requirements-dev.txt
      - name: A PostgreSQL client for the harness (it drops its scratch schemas)
        run: command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run the server stack and the fast live tests
        env:
          EVE_LIVE_LOG_DIR: ${{ github.workspace }}/.live-logs
          KEEP_LOGS: "1"
        run: tools/dev/run-eve-live.sh
      - name: Keep the logs of the stack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-logs
          path: .live-logs
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    name: Windows Rust, .NET, Python and live client
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(inputs.jobs, 'windows')) }}
    uses: ./.github/workflows/ci-windows.yml

  gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [rust-fmt, rust-test, dotnet-build, dotnet, python, fixtures, live, windows]
    steps:
      - name: Require all selected jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Required CI gate for $GITHUB_SHA ($GITHUB_REF)"
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
