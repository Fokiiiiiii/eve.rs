[workspace]
resolver = "3"
members = [
    "crates/eve-marshal",
    "crates/eve-destiny",
    "crates/eve-oracle",
    "crates/eve-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
