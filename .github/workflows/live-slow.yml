name: Live (slow)

# The end-to-end tests that take minutes (a pilot undocks, fights a rat, dies, jumps): every test file of the headless
# client against the whole server stack, each on its own. This workflow is dispatch-only; the fast ones run on pushes (ci.yml).

# The nightly schedule is switched off (2026-10-04, the owner's request). Dispatch one file or all files from the Actions tab or helper.
'on':
  workflow_dispatch:
    inputs:
      test_file:
        description: 'One test filename, or all'
        required: true
        default: all
        type: choice
        options:
          - all
          - test_abyssal.py
          - test_achievement_tracker_live.py
          - test_agents_live.py
          - test_aggression.py
          - test_alpha_injector_live.py
          - test_ammo.py
          - test_arc29_walk.py
          - test_belt_rats.py
          - test_cargo.py
          - test_character_delete.py
          - test_command_burst_live.py
          - test_clone_install_live.py
          - test_clone_jump_live.py
          - test_crab_walk.py
          - test_crimewatch.py
          - test_death.py
          - test_describe.py
          - test_drone_flight.py
          - test_drones.py
          - test_ess.py
          - test_expert_system_live.py
          - test_faction_standing_live.py
          - test_fob_insystem_walk.py
          - test_fob_walk.py
          - test_fw_battlefield_walk.py
          - test_fw_capture_walk.py
          - test_fw_complex_walk.py
          - test_gm_commands_live.py
          - test_handshake_mock.py
          - test_health.py
          - test_implant_live.py
          - test_incursion_walk.py
          - test_insider_gm_live.py
          - test_jump.py
          - test_jump_clone_live.py
          - test_live.py
          - test_login_milestone_live.py
          - test_login_to_character.py
          - test_loot.py
          - test_market.py
          - test_marshal_golden.py
          - test_missile.py
          - test_mission_walk.py
          - test_mitm.py
          - test_module.py
          - test_movement.py
          - test_multi_training_live.py
          - test_npc.py
          - test_official_client_launch.py
          - test_others.py
          - test_planet_walk.py
          - test_player_bounty_live.py
          - test_pochven_live.py
          - test_population_cap_live.py
          - test_project_discovery_live.py
          - test_projected.py
          - test_recorded_scenarios.py
          - test_reload.py
          - test_repair.py
          - test_resculpt_live.py
          - test_skill_bundle_info_live.py
          - test_skill_plan_live.py
          - test_store_entitlements_live.py
          - test_structures.py
          - test_target.py
          - test_title_live.py
          - test_undock.py
          - test_user_votes_live.py
          - test_walk_blueprints.py
          - test_walk_bookmarks.py
          - test_walk_corp_station.py
          - test_walk_industry.py
          - test_walk_item_locking.py
          - test_walk_nes_intro.py
          - test_walk_reprocessing.py
          - test_walk_shared_bookmarks.py
          - test_walk_trade.py
          - test_walk_war_registry.py
          - test_warp.py
          - test_weapon.py
          - test_wormhole_live.py
          - test_zarzakh_jump.py

concurrency:
  group: live-slow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the toolchain the project is built and tested with (Cargo.toml's rust-version is 1.94); a newer clippy's new lints are
  # looked at by the advisory job below, not allowed to break the build
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  EVE_MARKET_SEED: skip

jobs:
  live-slow:
    name: Live slow (${{ matrix.test_file }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJSON(inputs.test_file == 'all' && '["test_abyssal.py","test_achievement_tracker_live.py","test_agents_live.py","test_aggression.py","test_alpha_injector_live.py","test_ammo.py","test_arc29_walk.py","test_belt_rats.py","test_cargo.py","test_character_delete.py","test_command_burst_live.py","test_clone_install_live.py","test_clone_jump_live.py","test_crab_walk.py","test_crimewatch.py","test_death.py","test_describe.py","test_drone_flight.py","test_drones.py","test_ess.py","test_expert_system_live.py","test_faction_standing_live.py","test_fob_insystem_walk.py","test_fob_walk.py","test_fw_battlefield_walk.py","test_fw_capture_walk.py","test_fw_complex_walk.py","test_gm_commands_live.py","test_handshake_mock.py","test_health.py","test_implant_live.py","test_incursion_walk.py","test_insider_gm_live.py","test_jump.py","test_jump_clone_live.py","test_live.py","test_login_milestone_live.py","test_login_to_character.py","test_loot.py","test_market.py","test_marshal_golden.py","test_missile.py","test_mission_walk.py","test_mitm.py","test_module.py","test_movement.py","test_multi_training_live.py","test_npc.py","test_official_client_launch.py","test_others.py","test_planet_walk.py","test_player_bounty_live.py","test_pochven_live.py","test_population_cap_live.py","test_project_discovery_live.py","test_projected.py","test_recorded_scenarios.py","test_reload.py","test_repair.py","test_resculpt_live.py","test_skill_bundle_info_live.py","test_skill_plan_live.py","test_store_entitlements_live.py","test_structures.py","test_target.py","test_title_live.py","test_undock.py","test_user_votes_live.py","test_walk_blueprints.py","test_walk_bookmarks.py","test_walk_corp_station.py","test_walk_industry.py","test_walk_item_locking.py","test_walk_nes_intro.py","test_walk_reprocessing.py","test_walk_shared_bookmarks.py","test_walk_trade.py","test_walk_war_registry.py","test_warp.py","test_weapon.py","test_wormhole_live.py","test_zarzakh_jump.py"]' || format('["{0}"]', inputs.test_file)) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVE_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/eve
      EVE_LIVE_LOG_DIR: ${{ github.workspace }}/.live-logs
      KEEP_LOGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-10-19
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: sde-build
        run: echo "build=$(sed -n 's/^PINNED_BUILD=//p' sde/fetch.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc834e66ea1d0cc317b6db6e4c053c1b0c62c9 # v6.1.0
        with:
          path: .cache/sde
          key: sde-${{ steps.sde-build.outputs.build }}
      - name: Load the static data into PostgreSQL
        run: cargo run -q -p eve-sde -- ensure --pg "$EVE_PG_URL"
      - name: A PostgreSQL client for the harness (it drops its scratch schemas)
        run: command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install the headless client
        run: |
          python3 -m venv tools/headless-client/.venv
          tools/headless-client/.venv/bin/pip install -q -r tools/headless-client/requirements-dev.txt
      - name: Run this test file against the server stack
        env:
          EVE_RUN: tools/headless-client/.venv/bin/python -m pytest -q tools/headless-client/tests/${{ matrix.test_file }} -rs
          EVE_LIVE_SLOW: "1"
        run: tools/dev/run-eve-live.sh
      - name: Keep the logs of the stack
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-slow-logs-${{ matrix.test_file }}
          path: .live-logs
          if-no-files-found: ignore
